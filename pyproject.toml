[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groupval"
version = "0.1.1"
description = "Validate language model labels within each group before comparing groups"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jacob Crainic" }, { name = "Brandon Yee" }]
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy"]

[project.urls]
Repository = "https://github.com/Nyxius-Labs/groupval"
